[project]
name = "ssamba"
version = "0.1.0"
description = "Self-Supervised Audio Mamba"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = [
    "torch==2.2.2",
    "torchaudio==2.2.2",
    "mamba-ssm==2.3.1",  # was 1.2.0.post1
    "causal-conv1d==1.6.1",  # was 1.2.0.post2
    "einops==0.8.0",
    "ipython==8.24.0",
    "matplotlib==3.6.2",
    "numpy==1.23.4",
    "scikit-learn==1.5.0",
    "scipy==1.9.3",
    "timm==1.0.3",
    "wget==3.2",
    "gdown>=5.1.0",
]

[project.optional-dependencies]
superb = ["s3prl"]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "vulture>=2.16",
]

[tool.uv]
torch-backend = "auto"

